# Configurazione del benchmark. nginx parte con -p <cartella del benchmark>:
# i percorsi relativi (pid, log, root) sono relativi a quella cartella.
# daemon off: il master resta in primo piano come figlio di btp, che lo ferma
# con SIGQUIT. Le porte sono quelle del TOML (ready e URL di wrk).
daemon off;
worker_processes 1;
worker_cpu_affinity 0010;
pid logs/nginx.pid;
error_log logs/error.log;

events { worker_connections 1024; }

http {
    access_log off;
    sendfile on;
    tcp_nopush on;
    keepalive_requests 100000;

    upstream back { server 127.0.0.1:18081; keepalive 32; }

    # backend del caso proxy
    server {
        listen 127.0.0.1:18081;
        root html;
    }

    server {
        listen 127.0.0.1:18080;
        root html;
        location = /gzip.html { gzip on; gzip_types *; gzip_min_length 0; }
        location /proxy/ {
            proxy_pass http://back/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}