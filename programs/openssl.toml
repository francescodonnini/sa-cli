# no-asm: niente assembly (non passerebbe dal pass), resta il codice C.
# no-shared, no-module: libcrypto, libssl e provider dentro gli eseguibili.
# Configure senza i flag della configurazione. Nel Makefile i flag della
# piattaforma sono in CNF_CFLAGS/CNF_LDFLAGS; CFLAGS e LDFLAGS sono la parte
# dell'utente, di default "-Wall -O3" e vuoto: qui si riscrivono aggiungendo i
# flag della configurazione. make test dovrà ricevere gli stessi valori.
[source]
git = "https://github.com/openssl/openssl"
ref = "openssl-3.5.9"

[build]
copy_source = true
steps = [
    ["./Configure", "linux-x86_64", "no-asm", "no-shared", "no-module", "CC={cc}"],
    ["make", "-j{jobs}", "CFLAGS=-Wall -O3 {copt}", "LDFLAGS={ldopt}"],
]
install = { "apps/openssl" = "openssl" }
verify = ["apps/openssl"]

[test]
# test/recipes/*.t con TAP::Harness (stesso formato di prove). make test usa gli stessi
# CFLAGS e LDFLAGS della build: se dovesse ricompilare qualcosa (programmi in test/),
# lo fa con la stessa strumentazione. HARNESS_JOBS: script eseguiti in parallelo.
[[test.suite]]
name = "recipes"
cmd = ["make", "test", "CFLAGS=-Wall -O3 {copt}", "LDFLAGS={ldopt}"]
# test_async e test_speed (con -async_jobs) avviano job asincroni su stack allocati con
# malloc (crypto/async/arch/async_posix.c): fuori dall'area, quindi in func e full
# terminano al primo prologo. Limite noto: stack forniti dal programma senza MAP_STACK.
env = { HARNESS_JOBS = "{jobs}", TESTS = "-test_async -test_speed" }
failures = "prove"