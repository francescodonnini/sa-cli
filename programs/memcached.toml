# Servono autoconf, automake e libevent-devel (di sistema, non strumentata).
# configure senza i flag della configurazione; a make si passano CPPFLAGS e
# LDFLAGS, che automake mette accanto a CFLAGS (che resta quello di configure)
# e che configure lascia vuoti con la libevent di sistema.
# --disable-coverage: altrimenti memcached-debug viene linkato con gcov.
# memcached-debug, testapp, sizes e timedrun servono a make test.
# openssl-devel e perl-IO-Socket-SSL servono per eseguire i test che usano openssl.
[source]
git = "https://github.com/memcached/memcached"
ref = "1.6.45"

[build]
copy_source = true
steps = [
    ["sh", "-c", "cd vendor && ./fetch.sh"],
    ["./autogen.sh"],
    ["./configure", "CC={cc}", "--disable-coverage", "--enable-proxy"],
    ["make", "-j{jobs}", "CPPFLAGS={copt}", "LDFLAGS={ldopt}",
        "memcached", "memcached-debug", "testapp", "sizes", "timedrun"],
]
install = { "memcached" = "memcached" }
verify = ["memcached", "memcached-debug"]

[test]
# controlla la dimensione delle strutture interne
[[test.suite]]
name = "sizes"
cmd = ["./sizes"]

# test unitari del codice del server (output TAP)
[[test.suite]]
name = "testapp"
cmd = ["./testapp"]
failures = "tap"

# test di protocollo in chiaro
[[test.suite]]
name = "t"
cmd = ["prove", "t"]
failures = "prove"

# gli stessi test su TLS, più ssl_*.t (certificati di prova in t/)
[[test.suite]]
name = "t-tls"
cmd = ["prove", "t"]
env = { SSL_TEST = "1" }
failures = "prove"