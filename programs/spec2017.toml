# SPEC CPU 2017, installata a mano in ~/spec2017 dall'ISO (licenza: fuori da git).
# Gli strumenti precompilati di SPEC richiedono libnsl e libxcrypt-compat.
# runcpu compila ed esegue: ogni configurazione di btp è una label, e binari, cartelle di
# esecuzione e risultati stanno nella cartella di build (output_root). I valori di btp
# arrivano al config tramite l'ambiente (BTP_*, letti con %{ENV_...} in btp.cfg).
# --rebuild: runcpu non sa se il pass o il runtime sono cambiati.
# Solo benchmark C/C++ (niente flang): intrate senza 548.exchange2_r, e fprate
# 508, 510, 511, 519, 526, 538, 544.
[source]
path = "~/spec2017"

[build]
steps = [
    ["cp", "{assets}/btp.cfg", "{src}/config/btp.cfg"],
    ["sh", "-c", "cd {src} && . ./shrc && runcpu --config=btp --action=build --rebuild --label={conf} --output_root={build} $BTP_BENCHMARKS"],
]
env = { BTP_CC = "{cc}", BTP_CXX = "{cxx}", BTP_COPT = "{copt}", BTP_LDOPT = "{ldopt}", BTP_JOBS = "{jobs}", BTP_BENCHMARKS = "500.perlbench_r 502.gcc_r 505.mcf_r 520.omnetpp_r 523.xalancbmk_r 525.x264_r 531.deepsjeng_r 541.leela_r 557.xz_r 508.namd_r 510.parest_r 511.povray_r 519.lbm_r 526.blender_r 538.imagick_r 544.nab_r" }

[test]
# input "test": piccoli, ma runcpu ne valida comunque l'output. --nobuild: si usano i
# binari della build; l'ambiente deve essere identico, altrimenti runcpu non li riconosce.
[[test.suite]]
name = "test-size"
cmd = ["sh", "-c", "ulimit -s unlimited; cd {src} && . ./shrc && runcpu --config=btp --action=run --nobuild --size=test --iterations=1 --label={conf} --output_root={build} $BTP_BENCHMARKS"]
env = { BTP_CC = "{cc}", BTP_CXX = "{cxx}", BTP_COPT = "{copt}", BTP_LDOPT = "{ldopt}", BTP_JOBS = "{jobs}", BTP_BENCHMARKS = "500.perlbench_r 502.gcc_r 505.mcf_r 520.omnetpp_r 523.xalancbmk_r 525.x264_r 531.deepsjeng_r 541.leela_r 557.xz_r 508.namd_r 510.parest_r 511.povray_r 519.lbm_r 526.blender_r 538.imagick_r 544.nab_r" }