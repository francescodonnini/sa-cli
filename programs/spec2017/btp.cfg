# Configurazione di SPEC CPU 2017 per btp. I valori arrivano dall'ambiente, impostato da
# spec2017.toml: BTP_CC, BTP_CXX, BTP_COPT, BTP_LDOPT, BTP_JOBS. La configurazione di btp
# è la label (--label), e binari e risultati stanno in output_root (la build di btp).
tune                 = base
output_format        = text,csv
reportable           = no
iterations           = 1
mean_anyway          = 1
command_add_redirect = 1
makeflags            = --jobs=%{ENV_BTP_JOBS}
# la label (la configurazione di btp) dà solo il nome a binari e cartelle: i flag
# che cambiano tra le configurazioni arrivano dall'ambiente (BTP_COPT, BTP_LDOPT)
allow_label_override = yes

default:
   CC                 = %{ENV_BTP_CC} -std=c99
   CXX                = %{ENV_BTP_CXX} -std=c++14
   CC_VERSION_OPTION  = --version
   CXX_VERSION_OPTION = --version
   OPTIMIZE           = -O2 %{ENV_BTP_COPT}
   EXTRA_LDFLAGS      = %{ENV_BTP_LDOPT}
   EXTRA_PORTABILITY  = -DSPEC_LP64
   # codice C vecchio: clang recente trasforma questi avvisi in errori
   EXTRA_CPORTABILITY = -Wno-error=implicit-function-declaration -Wno-error=implicit-int -Wno-error=int-conversion

# ---- portabilità (dall'esempio config/Example-gcc-linux-x86.cfg) ----
500.perlbench_r:
   PORTABILITY = -DSPEC_LINUX_X64
523.xalancbmk_r:
   PORTABILITY = -DSPEC_LINUX
   # writeSafe in XalanOtherEncodingWriter.hpp usa membri inesistenti: un template mai
   # istanziato che clang 19+ controlla subito; così il suo corpo non viene analizzato
   EXTRA_CXXFLAGS = -fdelayed-template-parsing
526.blender_r:
   PORTABILITY = -funsigned-char -DSPEC_LINUX

# ---- workaround per compilatori recenti (stessi dell'esempio) ----
intrate=base:
   EXTRA_CFLAGS = -fno-strict-aliasing -fgnu89-inline -fcommon
fprate=base:
   EXTRA_CFLAGS = -fno-strict-aliasing