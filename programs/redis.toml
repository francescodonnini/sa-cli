# Servono tcl (tclsh 8.5+) per i test. Solo redis-server è strumentato:
# REDIS_CFLAGS/REDIS_LDFLAGS valgono per il codice di Redis ma non per deps/
# (jemalloc, lua, hiredis), che restano senza flag.
# Fase 1: redis-server strumentato, messo da parte. Fase 2: tutto senza flag
# (il cambio di flag fa scattare un distclean automatico nel Makefile di Redis),
# poi redis-server strumentato rimesso al suo posto. redis-cli e redis-benchmark
# restano non strumentati: redis-benchmark è il client del benchmark.
[source]
git = "https://github.com/redis/redis"
ref = "8.8.0"

[build]
copy_source = true
steps = [
    ["make", "-j{jobs}", "CC={cc}", "OPTIMIZATION=-O2", "BUILD_TLS=no",
        "REDIS_CFLAGS={copt}", "REDIS_LDFLAGS={ldopt}", "redis-server"],
    ["cp", "src/redis-server", "redis-server.protected"],
    ["make", "-j{jobs}", "CC={cc}", "OPTIMIZATION=-O2", "BUILD_TLS=no"],
    ["cp", "redis-server.protected", "src/redis-server"],
]
install = { "src/redis-server" = "redis-server", "src/redis-cli" = "redis-cli",
    "src/redis-benchmark" = "redis-benchmark" }
verify = ["src/redis-server"]

[test]
# runtest avvia src/redis-server della build per ogni gruppo di test.
# --dump-logs stampa il log del server quando un test fallisce.
[[test.suite]]
name = "runtest"
cmd = ["./runtest", "--clients", "{jobs}", "--dump-logs"]
failures = "redis"